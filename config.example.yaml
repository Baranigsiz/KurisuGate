# ⚡ KurisuGate (クリス) Configuration Template
# Universal AI Gateway & Semantic Cache in Go

server:
  host: "0.0.0.0"
  port: 8080
  # Master API keys for admin / unrestricted access
  master_keys:
    - "sk-kurisu-local-master-key"
  
  # Virtual API Keys for team, client, and microservice quota & budget management
  virtual_keys:
    - key: "kg-proj-dev-team"
      name: "Development Team"
      monthly_budget_usd: 50.0   # Monthly spending cap ($50.00)
      rate_limit_rpm: 120        # Key-specific rate limit (requests/min)
      allowed_models:            # Restrict key to specific models (empty = all)
        - "gpt-4o-mini"
        - "claude-3-5-haiku-20241022"
        - "gemini-2.0-flash"
      enabled: true

    - key: "kg-client-prod"
      name: "Production Client"
      monthly_budget_usd: 250.0
      rate_limit_rpm: 300
      allowed_models: []         # All models permitted
      enabled: true

  enable_cors: true
  timeout_seconds: 120

guard:
  enabled: true
  mask_secrets: true
  mask_emails: true
  mask_cards: true
  mask_phone: false
  mask_ssn: true
  auto_json_repair: true # Strips markdown ```json fences & fixes broken brackets
  
  # Context and whitespace optimizer to lower token costs
  prompt_compression:
    enabled: true
    max_context_messages: 50 # Max messages to keep (preserves system prompt + last N turns)

cache:
  exact:
    enabled: true
    max_entries: 10000
    ttl_seconds: 3600
  semantic:
    enabled: true # Enabled with zero-cost local engine by default
    similarity_threshold: 0.90 # (0.85 - 0.95 recommended)
    # Options: "local" (zero-cost builtin N-gram vectorizer), "openai", "ollama", or "auto"
    embedding_provider: "local"
    embedding_model: "text-embedding-3-small" # used when provider is "openai" or "ollama"
    max_entries: 5000
    ttl_seconds: 7200
  
  # Persistent disk snapshots to survive container restarts & updates
  persistence:
    enabled: true
    file_path: "./data/kurisu_cache.json"
    snapshot_interval_seconds: 300
    restore_on_startup: true

rate_limit:
  enabled: false
  requests_per_minute: 300
  burst: 50

providers:
  # 1. OpenAI
  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    # Multi-Key Load Balancing Pool (automatic round-robin & 429 backoff):
    # api_keys: ["sk-key-1", "sk-key-2", "sk-key-3"]
    base_url: "https://api.openai.com/v1"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "o1"
      - "o3-mini"

  # 2. Anthropic Claude
  anthropic:
    enabled: true
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com/v1"
    models:
      - "claude-3-5-sonnet-20241022"
      - "claude-3-5-haiku-20241022"
      - "claude-3-opus-20240229"

  # 3. Google Gemini
  gemini:
    enabled: true
    api_key: "${GEMINI_API_KEY}"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    models:
      - "gemini-2.0-flash"
      - "gemini-1.5-pro"
      - "gemini-1.5-flash"

  # 4. DeepSeek (V3 & R1)
  deepseek:
    enabled: false
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    models:
      - "deepseek-chat"
      - "deepseek-reasoner"

  # 5. Groq (Ultra-fast LPUs)
  groq:
    enabled: false
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    models:
      - "llama-3.3-70b-versatile"
      - "llama-3.1-8b-instant"

  # 6. Mistral AI
  mistral:
    enabled: false
    api_key: "${MISTRAL_API_KEY}"
    base_url: "https://api.mistral.ai/v1"
    models:
      - "mistral-large-latest"
      - "codestral-latest"
      - "mistral-small-latest"
      - "pixtral-large-latest"

  # 7. xAI (Grok)
  xai:
    enabled: false
    api_key: "${XAI_API_KEY}"
    base_url: "https://api.x.ai/v1"
    models:
      - "grok-2"
      - "grok-2-vision"
      - "grok-beta"

  # 8. OpenRouter (Universal AI Aggregator)
  openrouter:
    enabled: false
    api_key: "${OPENROUTER_API_KEY}"
    base_url: "https://openrouter.ai/api/v1"
    models:
      - "auto"
      - "openai/gpt-4o"
      - "anthropic/claude-3.5-sonnet"
      - "deepseek/deepseek-r1"

  # 9. Together AI
  together:
    enabled: false
    api_key: "${TOGETHER_API_KEY}"
    base_url: "https://api.together.xyz/v1"
    models:
      - "meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo"
      - "deepseek-ai/DeepSeek-R1"

  # 10. Perplexity AI (Search LLMs)
  perplexity:
    enabled: false
    api_key: "${PERPLEXITY_API_KEY}"
    base_url: "https://api.perplexity.ai"
    models:
      - "sonar-pro"
      - "sonar"
      - "sonar-reasoning"

  # 11. Cohere
  cohere:
    enabled: false
    api_key: "${COHERE_API_KEY}"
    base_url: "https://api.cohere.com/v2"
    models:
      - "command-r-plus"
      - "command-r"

  # 12. Local Ollama (100% Free & Offline)
  ollama:
    enabled: true
    base_url: "http://localhost:11434"
    models:
      - "llama3.2"
      - "llama3.1"
      - "mistral"
      - "deepseek-r1:8b"

routing:
  # Map convenient friendly aliases to specific models or smart routers
  model_aliases:
    "cheapest": "cheapest" # Dynamically picks lowest cost active model
    "fastest": "fastest"   # Dynamically picks lowest latency active model
    "fast": "gpt-4o-mini"
    "smart": "gpt-4o"
    "claude": "claude-3-5-sonnet-20241022"
    "gemini": "gemini-2.0-flash"
    "deepseek": "deepseek-chat"
    "r1": "deepseek-reasoner"
    "grok": "grok-2"
    "mistral": "mistral-large-latest"
    "local": "llama3.2"

  # A/B Testing & Weighted Provider Load Balancing
  weighted_targets:
    "hybrid-chat":
      - provider: "deepseek"
        model: "deepseek-chat"
        weight: 70 # 70% of requests routed to DeepSeek
      - provider: "openai"
        model: "gpt-4o-mini"
        weight: 30 # 30% of requests routed to OpenAI

  # Automatic fallback chains when primary provider returns 429 (Rate Limit) or 5xx error
  fallback_chains:
    "gpt-4o":
      - "claude-3-5-sonnet-20241022"
      - "gemini-2.0-flash"
      - "deepseek-chat"
      - "llama-3.3-70b-versatile"
      - "llama3.2"
    "claude-3-5-sonnet-20241022":
      - "gpt-4o"
      - "gemini-2.0-flash"
      - "deepseek-chat"
    "deepseek-reasoner":
      - "o3-mini"
      - "o1"
      - "claude-3-5-sonnet-20241022"
