name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Build (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Binary
        run: go build -v ./cmd/kurisu

      - name: Run Test Suite (Ubuntu with Race Detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -race ./tests

      - name: Run Test Suite (Non-Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        run: go test -v ./tests

      - name: Run Benchmarks
        run: go test -bench=. -benchmem -run=^$ ./benchmarks

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kurisugate:test
