name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Binary
        run: go build -v ./...

      - name: Run Test Suite
        run: go test -v -race ./tests

      - name: Run Benchmarks
        run: go test -bench=. -benchmem -run=^$ ./benchmarks
