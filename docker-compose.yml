version: '3.8'

services:
  # Kurisu Universal AI Gateway
  kurisugate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kurisugate
    restart: unless-stopped
    ports:
      - "${KURISU_PORT:-8080}:8080"
    environment:
      - KURISU_HOST=0.0.0.0
      - KURISU_PORT=8080
      - KURISU_CACHE_PERSISTENCE_ENABLED=true
      - KURISU_CACHE_FILE=/app/data/kurisu_cache.json
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_API_KEYS=${ANTHROPIC_API_KEYS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./config.example.yaml:/app/kurisu.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - kurisu-network

  # Optional local Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: kurisu-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - kurisu-network
    profiles:
      - ollama

networks:
  kurisu-network:
    driver: bridge

volumes:
  ollama_models:
